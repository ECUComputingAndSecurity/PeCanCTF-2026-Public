<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StickyNotes — Access Denied</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 3rem 2.5rem;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
        }
        .icon { font-size: 3.5rem; display: block; margin-bottom: 1rem; }
        h1 { font-size: 1.3rem; color: #e74c3c; margin-bottom: 0.5rem; }
        p { font-size: 0.88rem; color: #777; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.55rem 1.25rem;
            background: #ffd700;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        a:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🔒</span>
        <h1>Access Denied</h1>
        <p>You don't have permission to view this page. Admin access is required.</p>
        <a href="/notes">Back to Notes</a>
    </div>
</body>
</html>
