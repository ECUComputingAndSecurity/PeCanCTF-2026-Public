[unix_http_server]
file=/run/supervisor.sock
chmod=0700
username=devhub
password=supervisor-local

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock
username=devhub
password=supervisor-local

[program:web]
directory=/srv/app
command=gunicorn --bind 127.0.0.1:5000 --workers 2 --worker-class gthread --threads 8 --preload app:app
priority=10
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:events]
directory=/srv/app
command=gunicorn --bind 127.0.0.1:5002 --workers 1 --worker-class gthread --threads 64 --preload app:app
priority=20
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bot]
directory=/srv/admin-bot
command=gunicorn --bind 127.0.0.1:5001 --workers 1 --worker-class gthread --threads 8 bot:app
priority=30
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
