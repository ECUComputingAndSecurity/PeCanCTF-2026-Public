name: Patch Tuesday Aftermath
author: Kelly Kallane (Git-Error)
category: forensics
description: |
  Your Windows Sandbox environment has been acting, loud.
  Not broken exactly, just suspiciously chatty, like a dev machine that has been left alone with too much mountain dew and monster without supervision.

  A monitoring agent called PatchTuesdaySurvivor was deployed to “help stabilise telemetry,” but shortly after activation,
  the system began generating unusual event logs and noisy process activity - although let's be honest, Windows and stability are very much opposites here.

  Somewhere in the flood of a poor, up-at-3am-dev's tears, lies a base64-encoded flag  written into the logs.

  Unlike Windows, your task is simple and nowhere near as bloated:

  Find the HIDDEN fla-- I mean message.

  Yes. Find the hidden MESSAGE

  \*\*\*Note that not many vulnerabilities were harmed or exploited leading up to this week's Patch Tuesday
attribution: Kelly Kallane (Git-Error)
type: dynamic

extra:
  initial: 500
  decay: 4
  function: linear
  minimum: 100

flags:
- type: static
  data: case_insensitive
  content: Pecan{windows_is_just_a_noisy_vm_with_extra_steps}

files:
- Patch_Tuesday_Aftermath.evtx

version: '0.1'
