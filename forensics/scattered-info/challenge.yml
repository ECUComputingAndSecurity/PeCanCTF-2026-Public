name: Scattered Info
author: Kelly K
category: forensics
description: |
  With little experience in cybersecurity and relying solely on existing malicious scripts to compromise the
  target system, you perform a packet capture with a goated tool, Wireshark, and discover that packets weren't the only thing
  being transferred between devices. Look deeper - TO INFINITY AND BEYOND - and you may find something based......
