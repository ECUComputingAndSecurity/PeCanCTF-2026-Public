name: "Blockchain: Ancient Vault"
author: Raahguu

description: |
    I found this old tomb, after talking to the locals 
    apparently if the sacred number is spoken it reveals its secrets. 
    Sadly this so called secret number seems to be lost to time.
category: misc
attribution: Raahguu
image: ./app/.
protocol: https

type: dynamic

extra:
  initial: 500
  decay: 4
  function: linear
  minimum: 100

flags:
