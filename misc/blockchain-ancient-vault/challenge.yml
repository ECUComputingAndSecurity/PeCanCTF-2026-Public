    data: case_insensitive
    content: pecan{01d_v4u175_4r3_w3ird_bu7_1337}

hints:
  - |
    I think I see an inscription in the side of the tomb saying 'use foundry'
  - |
    Is that another one mentioning 'cast send'? One can only imagine what that means

files:
  - app/AncientVault.sol

version: '0.1'
